<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de Gestión de Procesos | REFAX</title>
  <link rel="icon" href="assets/img/logo-refax.png">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #1f2937; }
    .wrap { max-width: 760px; margin: 80px auto; padding: 24px; }
    .card { background: white; border-radius: 16px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    .logo { max-width: 180px; margin-bottom: 24px; }
    h1 { margin: 0 0 12px; }
    .status { margin-top: 24px; padding: 16px; border-radius: 10px; background: #f3f4f6; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <img src="assets/img/logo-refax.png" class="logo" alt="REFAX">
      <h1>Portal de Gestión de Procesos</h1>
      <p class="muted">Paso 1 de la migración: GitHub Pages ↔ Azure API.</p>
      <div class="status">
        <strong id="api-status">Comprobando backend…</strong>
        <div id="api-detail" class="muted"></div>
      </div>
    </section>
  </main>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/health.js"></script>
</body>
</html>

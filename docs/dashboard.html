<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Portal de Procesos</title>
  <link rel="icon" href="assets/img/logo-refax.png">
  <link rel="stylesheet" href="assets/css/estilos.css">
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f4f6f8; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 28px; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.08); }
    .top img { width:120px; }
    .top button { border:0; border-radius:9px; padding:10px 14px; cursor:pointer; }
    .content { max-width:1100px; margin:40px auto; padding:0 22px; }
    .card { background:#fff; border-radius:16px; padding:28px; box-shadow:0 8px 30px rgba(0,0,0,.07); }
    .badge { display:inline-block; padding:5px 10px; border-radius:999px; background:#eef2f6; font-size:.85rem; }
  </style>
</head>
<body>
  <header class="top">
    <img src="assets/img/logo-refax.png" alt="REFAX">
    <div>
      <span id="userInfo"></span>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <main class="content">
    <section class="card">
      <h1>Dashboard</h1>
      <p id="welcome">Validando sesión...</p>
      <p><span class="badge" id="roleBadge"></span></p>
      <p>✅ Login por token funcionando. En el siguiente paso conectaremos el módulo de Áreas.</p>
    </section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    (async () => {
      const usuario = await requireAuth();
      if (!usuario) return;
      document.getElementById("userInfo").textContent = usuario.nombre;
      document.getElementById("welcome").textContent = `Bienvenida/o, ${usuario.nombre}.`;
      document.getElementById("roleBadge").textContent = `Rol: ${usuario.rol}`;
    })();
  </script>
</body>
</html>

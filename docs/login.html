<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Portal de Procesos</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon-docs.svg">
  <link rel="stylesheet" href="assets/css/estilos.css">
  <meta name="theme-color" content="#f58220">
</head>
<body class="login-page">
  <div class="login-layout login-layout-premium">

    <section class="login-side login-side-premium">
      <div class="login-hero-premium">
        <div class="login-brand-premium">
          <img src="assets/img/logo-refax.png" alt="REFAX Perú">
        </div>

        <div class="login-heading-premium">
          <span class="login-kicker-premium">REFAX Perú</span>
          <h1>Portal de Gestión<br>de Procesos</h1>
        </div>

        <div class="login-visual-premium" aria-hidden="true">
          <div class="visual-orb visual-orb-a"></div>
          <div class="visual-orb visual-orb-b"></div>

          <div class="visual-doc-card">
            <div class="visual-doc-top">
              <div class="visual-doc-icon">📄</div>
              <div class="visual-doc-badge">Documentación</div>
            </div>

            <div class="visual-doc-lines">
              <span></span>
              <span></span>
              <span></span>
            </div>

            <div class="visual-modules">
              <div class="visual-module"><i></i><b>Procesos</b></div>
              <div class="visual-module"><i></i><b>Documentos</b></div>
              <div class="visual-module"><i></i><b>Guías</b></div>
              <div class="visual-module"><i></i><b>Manuales</b></div>
              <div class="visual-module"><i></i><b>Políticas</b></div>
            </div>
          </div>

          <div class="visual-float-card visual-float-one">
            <span class="visual-float-dot"></span>
            <div><i></i><i></i></div>
          </div>

          <div class="visual-float-card visual-float-two">
            <span class="visual-float-dot"></span>
            <div><i></i><i></i></div>
          </div>
        </div>
      </div>
    </section>

    <section class="login-card-wrap login-card-wrap-premium">
      <main class="login-card login-card-premium">
        <div class="login-card-mark">🗂️</div>
        <span class="login-card-kicker">Bienvenida</span>
        <h2>Iniciar sesión</h2>

        <form id="loginForm">
          <label for="username">Usuario
            <input
              id="username"
              name="username"
              class="input"
              autocomplete="username"
              required
            >
          </label>

          <label for="password">Contraseña
            <input
              id="password"
              name="password"
              class="input"
              type="password"
              autocomplete="current-password"
              required
            >
          </label>

          <button id="submitBtn" class="btn btn-primary login-submit" type="submit">
            Ingresar
          </button>

          <div id="msg"></div>
        </form>
      </main>
    </section>

  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    if (getAccessToken()) {
      getCurrentUser()
        .then(() => location.href = "dashboard.html")
        .catch(clearAccessToken);
    }

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const msg = document.getElementById("msg");
      const button = document.getElementById("submitBtn");

      msg.textContent = "";
      button.disabled = true;
      button.textContent = "Ingresando...";

      try {
        await login(
          document.getElementById("username").value.trim(),
          document.getElementById("password").value
        );
        location.href = "dashboard.html";
      } catch (error) {
        msg.textContent = error.message || "No fue posible iniciar sesión.";
      } finally {
        button.disabled = false;
        button.textContent = "Ingresar";
      }
    });
  </script>
</body>
</html>

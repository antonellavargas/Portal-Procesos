<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Portal de Procesos</title>
  <link rel="icon" type="image/png" href="assets/img/favicon-refax.png">
  <link rel="stylesheet" href="assets/css/estilos.css">
  <style>
    body { min-height:100vh; display:grid; place-items:center; background:#f4f6f8; }
    .login-box { width:min(420px,92vw); background:#fff; padding:32px; border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.12); }
    .login-box img { display:block; max-width:150px; margin:0 auto 18px; }
    .login-box h1 { margin:0 0 6px; font-size:1.45rem; text-align:center; }
    .login-box p { text-align:center; color:#667085; margin-bottom:24px; }
    .login-box label { display:block; margin:14px 0 6px; font-weight:600; }
    .login-box input { width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid #d0d5dd; border-radius:10px; }
    .login-box button { width:100%; margin-top:20px; padding:12px; border:0; border-radius:10px; cursor:pointer; background:#232323; color:#fff; font-weight:700; }
    #msg { min-height:24px; margin-top:12px; text-align:center; color:#b42318; }
  </style>
<meta name="theme-color" content="#f58220"></head>
<body>
  <main class="login-box">
    <img src="assets/img/logo-refax.png" alt="REFAX">
    <h1>Portal de Gestión de Procesos</h1>
    <p>Ingresa con tu usuario autorizado.</p>

    <form id="loginForm">
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button id="submitBtn" type="submit">Ingresar</button>
      <div id="msg"></div>
    </form>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    if (getAccessToken()) {
      getCurrentUser().then(() => location.href = "dashboard.html").catch(clearAccessToken);
    }

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const msg = document.getElementById("msg");
      const button = document.getElementById("submitBtn");
      msg.textContent = "";
      button.disabled = true;
      button.textContent = "Ingresando...";

      try {
        await login(
          document.getElementById("username").value.trim(),
          document.getElementById("password").value
        );
        location.href = "dashboard.html";
      } catch (error) {
        msg.textContent = error.message || "No fue posible iniciar sesión.";
      } finally {
        button.disabled = false;
        button.textContent = "Ingresar";
      }
    });
  </script>
</body>
</html>

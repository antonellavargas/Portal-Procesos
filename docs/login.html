<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Portal de Procesos</title>
  <link rel="icon" type="image/png" href="assets/img/favicon-refax.png">
  <link rel="stylesheet" href="assets/css/estilos.css">
  <meta name="theme-color" content="#f58220">
</head>
<body>
  <div class="login-layout">
    <section class="login-side">
      <div>
        <div class="login-brand"><img src="assets/img/logo-refax.png" alt="REFAX"></div>
        <div class="login-copy">
          <h1>Portal de Gestión de Procesos</h1>
        </div>
        <div class="login-points">
          <div>📂</div>
        </div>
      </div>
      <div class="muted">Refax Perú</div>
    </section>

    <section class="login-card-wrap">
      <main class="login-card">
        <div class="eyebrow">Bienvenida</div>
        <h2>Iniciar sesión</h2>

        <form id="loginForm">
          <label for="username">Usuario
            <input id="username" name="username" class="input" autocomplete="username" required>
          </label>

          <label for="password">Contraseña
            <input id="password" name="password" class="input" type="password" autocomplete="current-password" required>
          </label>

          <button id="submitBtn" class="btn btn-primary" type="submit">Ingresar</button>
          <div id="msg"></div>
        </form>

        <div class="login-helper">Si necesitas ayuda, solicita apoyo a Soporte TI.</div>
      </main>
    </section>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    if (getAccessToken()) {
      getCurrentUser().then(() => location.href = "dashboard.html").catch(clearAccessToken);
    }

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const msg = document.getElementById("msg");
      const button = document.getElementById("submitBtn");
      msg.textContent = "";
      button.disabled = true;
      button.textContent = "Ingresando...";

      try {
        await login(
          document.getElementById("username").value.trim(),
          document.getElementById("password").value
        );
        location.href = "dashboard.html";
      } catch (error) {
        msg.textContent = error.message || "No fue posible iniciar sesión.";
      } finally {
        button.disabled = false;
        button.textContent = "Ingresar";
      }
    });
  </script>
</body>
</html>
